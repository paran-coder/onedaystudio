<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>관리자 — 원데이 스튜디오</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" />
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body class="admin">
  <header class="anav">
    <div class="awrap anav__inner">
      <span class="anav__brand">관리자</span>
      <div class="anav__right">
        <a href="../" target="_blank" rel="noopener" class="link">사이트 보기 ↗</a>
        <button type="button" class="tbtn" id="logout" hidden>로그아웃</button>
      </div>
    </div>
  </header>

  <main class="awrap">
    <section id="login" class="login">
      <span class="label">LOCKED</span>
      <h1 class="login__title">비밀번호를 입력하세요</h1>
      <form id="login-form" class="login__form">
        <input type="password" id="pw" autocomplete="current-password" aria-label="비밀번호" required />
        <button type="submit" class="btn btn--dark">들어가기</button>
      </form>
      <p class="msg" id="login-msg" role="alert"></p>
    </section>

    <section id="editor" hidden>
      <div class="savebar">
        <span class="msg" id="status" role="status" aria-live="polite">변경한 내용은 저장해야 사이트에 반영돼요.</span>
        <button type="button" class="btn btn--primary" id="save">저장</button>
      </div>

      <div class="ablock">
        <h2 class="ablock__title">소개 문구</h2>
        <p class="hint">첫 화면 제목 아래에 나오는 소개 글이에요.</p>
        <textarea id="intro" rows="4" maxlength="600"></textarea>
      </div>

      <div class="ablock">
        <h2 class="ablock__title">연락처</h2>
        <p class="hint">값을 비우면 화면에서 사라져요. 첫 번째 줄이 큰 검정 버튼에 연결됩니다.</p>
        <label class="field"><span>안내 문구</span><textarea id="contact-desc" rows="2" maxlength="400"></textarea></label>
        <div id="channels" class="channels-admin"></div>
        <button type="button" class="tbtn" id="add-channel">+ 연락 수단 추가</button>
      </div>

      <div class="ablock">
        <h2 class="ablock__title">포트폴리오</h2>
        <p class="hint">왼쪽 ⠿ 를 끌어서 순서를 바꿔요. 지우는 대신 「숨기기」를 쓰면 사이트에서만 사라지고 내용은 남아요.</p>
        <ul id="works-admin" class="rows"></ul>
        <button type="button" class="tbtn" id="add-work">+ 작업물 추가</button>
      </div>
    </section>
  </main>

  <script src="../content.js"></script>
  <script src="../merge.js"></script>
  <script src="admin.js"></script>
</body>
</html>
