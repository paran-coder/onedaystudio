<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>원데이 스튜디오 — 홈페이지 · PPT 디자인</title>
  <meta name="description" content="홈페이지와 PPT를 디자인합니다." />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="nav">
    <div class="wrap grid12 nav__inner">
      <a href="#top" class="nav__brand" data-text="name"></a>
      <nav class="nav__links">
        <a href="#works">작업물</a>
        <a href="#about">소개</a>
        <a href="#contact">의뢰하기</a>
      </nav>
    </div>
  </header>

  <main id="top">
    <section class="hero">
      <div class="wrap grid12 hero__grid">
        <aside class="side side--rule">
          <span class="label" data-text="hero.label"></span>
          <span class="square" aria-hidden="true"></span>
        </aside>
        <div class="main hero__main">
          <p class="eyebrow" data-text="hero.eyebrow"></p>
          <h1 class="hero__title" id="hero-title"></h1>
          <div class="hero__foot">
            <p class="hero__desc" data-text="hero.description"></p>
            <div class="hero__actions">
              <a href="#contact" class="btn btn--primary" data-text="hero.cta"></a>
              <a href="#works" class="link" data-text="hero.secondary"></a>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section id="works" class="block">
      <div class="wrap grid12">
        <aside class="side"><span class="label" data-text="works.label"></span></aside>
        <div class="main">
          <h2 class="h2" data-text="works.title"></h2>
          <p class="lede" data-text="works.description"></p>
          <div class="list" id="works-list"></div>
        </div>
      </div>
    </section>

    <section id="about" class="block">
      <div class="wrap grid12">
        <aside class="side"><span class="label" data-text="about.label"></span></aside>
        <div class="main">
          <h2 class="h2" data-text="about.title"></h2>
          <div class="cells" id="about-points"></div>
        </div>
      </div>
    </section>

    <section id="contact" class="block contact">
      <div class="wrap grid12">
        <aside class="side"><span class="label" data-text="contact.label"></span></aside>
        <div class="main">
          <h2 class="h2 h2--xl" data-text="contact.title"></h2>
          <p class="lede" data-text="contact.description"></p>
          <div class="list" id="contact-channels"></div>
          <div class="contact__cta">
            <a href="#" class="btn btn--dark btn--lg" id="contact-cta"></a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap"><span class="label" data-text="footer"></span></div>
  </footer>

  <div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal__backdrop" data-close></div>
    <div class="modal__panel">
      <div class="modal__bar">
        <span class="label" id="modal-count"></span>
        <div class="modal__tools">
          <button type="button" class="tbtn" id="modal-prev" aria-label="이전 작업">← 이전</button>
          <button type="button" class="tbtn" id="modal-next" aria-label="다음 작업">다음 →</button>
          <button type="button" class="tbtn tbtn--solid" id="modal-close" aria-label="닫기">닫기 ✕</button>
        </div>
      </div>
      <div class="modal__body">
        <div class="gallery">
          <div class="stage" id="stage">
            <div class="track" id="track"></div>
            <button type="button" class="stage__nav stage__nav--prev" id="slide-prev" aria-label="이전 이미지">←</button>
            <button type="button" class="stage__nav stage__nav--next" id="slide-next" aria-label="다음 이미지">→</button>
          </div>
          <div class="thumbs" id="thumbs"></div>
        </div>
        <div class="info">
          <div>
            <span class="label" id="modal-cat"></span>
            <h3 class="info__title" id="modal-title"></h3>
            <p class="info__desc" id="modal-desc"></p>
          </div>
          <div class="info__foot">
            <dl class="meta" id="modal-meta"></dl>
            <a class="btn btn--primary" id="modal-link" target="_blank" rel="noopener">프로젝트 보기 ↗</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="content.js"></script>
  <script src="merge.js"></script>
  <script src="main.js"></script>
</body>
</html>
